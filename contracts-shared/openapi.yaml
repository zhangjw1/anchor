openapi: 3.0.3
info:
  title: Anchor API
  version: 0.2.0
  description: |
    链列表、地址簿、Swap 查询、资产余额与净值、Uniswap V3 报价。
    金额是最小单位整数的十进制字符串。地址在服务端以小写保存。
    价格与 USD 净值在流动性不足时为 null。
servers:
  - url: http://localhost:8080
paths:
  /api/v1/chains:
    get:
      operationId: listChains
      summary: 支持的链
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chain"
  /api/v1/watch-addresses:
    get:
      operationId: listWatchAddresses
      summary: 地址簿
      parameters:
        - $ref: "#/components/parameters/chainId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchAddress"
    post:
      operationId: createWatchAddress
      summary: 添加监控地址
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchAddressWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchAddress"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/watch-addresses/{id}:
    put:
      operationId: updateWatchAddress
      summary: 修改监控地址
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchAddressWrite"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchAddress"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteWatchAddress
      summary: 删除监控地址
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/swaps:
    get:
      operationId: listSwaps
      summary: Swap 分页
      parameters:
        - $ref: "#/components/parameters/chainId"
        - name: address
          in: query
          schema:
            type: string
          description: 监控地址，小写或校验后按小写匹配
        - name: dex
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            $ref: "#/components/schemas/Direction"
        - name: includeReorged
          in: query
          schema:
            type: boolean
            default: false
          description: 为 true 时包含 REORGED 记录；默认排除
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: beforeBlock
          in: query
          schema:
            type: integer
            format: int64
          description: keyset 游标，与 beforeLogIndex 同时使用（上一页最后一条的 blockNumber）
        - name: beforeLogIndex
          in: query
          schema:
            type: integer
          description: keyset 游标，与 beforeBlock 同时使用
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapPage"
  /api/v1/assets:
    get:
      operationId: getAssets
      summary: 钱包资产余额与净值
      description: |
        用 Multicall3 批量查询原生币与 ERC20 余额。
        默认包含原生币与 chains.yaml 的 quoteTokens；可用 tokens 追加其它 ERC20。
        单价来自流动性足够的 Uniswap V3 池；不足则为 null。净值单位为 USD（6 位小数的最小单位字符串，即微美元）。
      parameters:
        - $ref: "#/components/parameters/chainId"
        - name: address
          in: query
          required: true
          schema:
            type: string
          description: 钱包地址
        - name: tokens
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: 额外 ERC20 地址，可重复传参
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetPortfolio"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/quotes:
    post:
      operationId: createQuote
      summary: Uniswap V3 单跳报价
      description: |
        对费率档 100/500/3000/10000 并发 eth_call QuoterV2，选 amountOut 最大者。
        返回价格影响、按滑点计算的 amountOutMinimum、执行 Gas 与 OP Stack L1 data fee、报价有效期。
        按客户端 IP 限流。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/trades/prepare:
    post:
      operationId: prepareTrade
      summary: 根据报价构建 approve / swap 待签交易
      description: |
        模式 A（用户钱包签名）。仅 base-sepolia 允许。
        校验报价未过期；检查 allowance；不足时返回 approve 交易（默认精确数量）。
        构建 SwapRouter02 exactInputSingle（经 multicall 带 deadline），eth_call 模拟 + estimateGas，失败返回 revert 原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradePrepareRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradePrepareResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/trades/report:
    post:
      operationId: reportTrade
      summary: 前端上报已广播的 txHash
      description: 登记追踪并开始轮询回执；仅 base-sepolia。通过 WebSocket tx 频道推送 TX_UPDATE。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeReportRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeStatus"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/trades/{txHash}:
    get:
      operationId: getTrade
      summary: 查询用户交易状态
      parameters:
        - $ref: "#/components/parameters/chainId"
        - name: txHash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeStatus"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    chainId:
      name: chainId
      in: query
      required: true
      schema:
        type: integer
        format: int64
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Chain:
      type: object
      required: [key, chainId, name, type, testnet, confirmationBlocks]
      properties:
        key:
          type: string
        chainId:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum: [EVM, SOLANA]
        testnet:
          type: boolean
        confirmationBlocks:
          type: integer
    Direction:
      type: string
      enum: [BUY, SELL, SWAP]
    ConfirmStatus:
      type: string
      enum: [CONFIRMING, CONFIRMED, FINALIZED, REORGED]
    AddressTag:
      type: string
      enum: [WATCH, ROUTER, MEV, WHALE, KOL]
    WatchAddressWrite:
      type: object
      required: [chainId, address, tag]
      properties:
        chainId:
          type: integer
          format: int64
        address:
          type: string
        name:
          type: string
        tag:
          $ref: "#/components/schemas/AddressTag"
        note:
          type: string
    WatchAddress:
      type: object
      required: [id, chainId, address, tag, swapCount, createdAt]
      properties:
        id:
          type: string
        chainId:
          type: integer
          format: int64
        address:
          type: string
        name:
          type: string
          nullable: true
        tag:
          $ref: "#/components/schemas/AddressTag"
        note:
          type: string
          nullable: true
        swapCount:
          type: integer
          format: int64
        lastActiveAt:
          type: integer
          format: int64
          nullable: true
          description: 最近一笔 Swap 的区块时间，毫秒
        createdAt:
          type: integer
          format: int64
          description: 毫秒时间戳
    TokenAmount:
      type: object
      required: [address, amount]
      properties:
        address:
          type: string
        symbol:
          type: string
          nullable: true
        decimals:
          type: integer
          nullable: true
        amount:
          type: string
          description: 最小单位整数
    SwapHop:
      type: object
      required: [hopIndex, dex, pool, tokenIn, tokenOut, logIndex]
      properties:
        hopIndex:
          type: integer
        dex:
          type: string
        pool:
          type: string
        tokenIn:
          $ref: "#/components/schemas/TokenAmount"
        tokenOut:
          $ref: "#/components/schemas/TokenAmount"
        logIndex:
          type: integer
    Swap:
      type: object
      required: [id, chainId, txHash, logIndex, blockNumber, direction, dex, tokenIn, tokenOut, confirmStatus, confirmations, watchedAddress, hops]
      properties:
        id:
          type: string
        chainId:
          type: integer
          format: int64
        txHash:
          type: string
        logIndex:
          type: integer
        blockNumber:
          type: integer
          format: int64
        timestamp:
          type: integer
          format: int64
          description: 区块时间，毫秒
        direction:
          $ref: "#/components/schemas/Direction"
        dex:
          type: string
        aggregator:
          type: string
          nullable: true
          description: tx.to 命中已知聚合器 Router 时的名称
        tokenIn:
          $ref: "#/components/schemas/TokenAmount"
        tokenOut:
          $ref: "#/components/schemas/TokenAmount"
        confirmStatus:
          $ref: "#/components/schemas/ConfirmStatus"
        confirmations:
          type: integer
          description: 相对已扫描块高的确认数，已回滚为 0
        watchedAddress:
          type: string
        hops:
          type: array
          items:
            $ref: "#/components/schemas/SwapHop"
    SwapPage:
      type: object
      required: [items, page, size, total, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Swap"
        page:
          type: integer
          description: 兼容字段，恒为 1；深翻页请用 nextBefore*
        size:
          type: integer
        total:
          type: integer
          format: int64
        hasMore:
          type: boolean
        nextBeforeBlock:
          type: integer
          format: int64
          nullable: true
        nextBeforeLogIndex:
          type: integer
          nullable: true
    AssetHolding:
      type: object
      required: [token, balance]
      properties:
        token:
          $ref: "#/components/schemas/TokenAmount"
        balance:
          type: string
          description: 最小单位整数余额；与 token.amount 相同，保留字段便于前端
        priceUsd:
          type: string
          nullable: true
          description: 单价，USD 的 6 位小数最小单位（微美元）；流动性不足为 null
        valueUsd:
          type: string
          nullable: true
          description: 持仓市值，微美元；价格缺失时为 null
    AssetPortfolio:
      type: object
      required: [chainId, address, holdings, netWorthUsd, asOfMs]
      properties:
        chainId:
          type: integer
          format: int64
        address:
          type: string
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/AssetHolding"
        netWorthUsd:
          type: string
          nullable: true
          description: 可计价持仓合计，微美元；全部无法计价时为 null
        asOfMs:
          type: integer
          format: int64
          description: 快照时间，毫秒
    QuoteRequest:
      type: object
      required: [chainId, tokenIn, tokenOut, amountIn, slippageBps]
      properties:
        chainId:
          type: integer
          format: int64
        tokenIn:
          type: string
          description: 付出代币；原生币用 0xeeee… 或 WETH
        tokenOut:
          type: string
          description: 收到代币；原生币用 0xeeee… 或 WETH
        amountIn:
          type: string
          description: 付出数量，最小单位整数
        slippageBps:
          type: integer
          minimum: 0
          maximum: 5000
          description: 滑点，基点；100 = 1%
    Quote:
      type: object
      required: [quoteId, chainId, tokenIn, tokenOut, amountIn, amountOut, amountOutMinimum, fee, priceImpactBps, gasEstimate, l1DataFeeWei, expiresAtMs]
      properties:
        quoteId:
          type: string
          description: 报价单号，后续构建交易时引用
        chainId:
          type: integer
          format: int64
        tokenIn:
          $ref: "#/components/schemas/TokenAmount"
        tokenOut:
          $ref: "#/components/schemas/TokenAmount"
        amountIn:
          type: string
        amountOut:
          type: string
        amountOutMinimum:
          type: string
          description: amountOut 按滑点折减后的最少收到量
        fee:
          type: integer
          description: 选中的 Uniswap V3 费率档，如 500
        priceImpactBps:
          type: integer
          description: 相对池子中间价的价格影响，基点
        gasEstimate:
          type: string
          description: QuoterV2 返回的执行 gas 估算
        l1DataFeeWei:
          type: string
          description: OP Stack L1 data fee，单位 wei
        expiresAtMs:
          type: integer
          format: int64
          description: 报价过期时间，毫秒
    TradePrepareRequest:
      type: object
      required: [quoteId, userAddress]
      properties:
        quoteId:
          type: string
        userAddress:
          type: string
        infiniteApprove:
          type: boolean
          default: false
          description: true 时 approve 为 max uint256；默认按 amountIn 精确授权
    UnsignedTx:
      type: object
      required: [chainId, to, data, value]
      properties:
        chainId:
          type: integer
          format: int64
        to:
          type: string
        data:
          type: string
        value:
          type: string
          description: wei，十进制字符串
        gas:
          type: string
          nullable: true
          description: estimateGas 结果；模拟失败时可能为空
    TradePrepareResponse:
      type: object
      required: [quoteId, expiresAtMs, needsApprove, swapTx, amountOutMinimum, deadline]
      properties:
        quoteId:
          type: string
        expiresAtMs:
          type: integer
          format: int64
        needsApprove:
          type: boolean
        approveTx:
          $ref: "#/components/schemas/UnsignedTx"
        swapTx:
          $ref: "#/components/schemas/UnsignedTx"
        amountOutMinimum:
          type: string
        deadline:
          type: integer
          format: int64
          description: Unix 秒
    TradeReportRequest:
      type: object
      required: [chainId, txHash, kind, userAddress]
      properties:
        chainId:
          type: integer
          format: int64
        txHash:
          type: string
        kind:
          type: string
          enum: [APPROVE, SWAP]
        quoteId:
          type: string
          nullable: true
        userAddress:
          type: string
    TradeStatus:
      type: object
      required: [chainId, txHash, kind, status]
      properties:
        chainId:
          type: integer
          format: int64
        txHash:
          type: string
        kind:
          type: string
          enum: [APPROVE, SWAP]
        status:
          type: string
          enum: [PENDING, CONFIRMED, FAILED, REPLACED]
        quoteId:
          type: string
          nullable: true
        userAddress:
          type: string
          nullable: true
        revertReason:
          type: string
          nullable: true
        updatedAtMs:
          type: integer
          format: int64
