global:
  scrape_interval: 15s

scrape_configs:
  - job_name: anchor-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: anchor-indexer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
  # parser 已并入 indexer 进程，不再单独抓取 8082
